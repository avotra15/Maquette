<div class="signpage">
    <div class="rectangle1">
        <p class="txt1">FIND 3D OBJECTS, MOCKUPS AND ILLUSTRATIONS HERE</p>

        <img [src]="'assets/images/Girlboy.jpg'" alt="Girlboy" class="Girlboy">
    </div>


    <div class="rectangle2">

            <p class="txtEn">English (UK)</p>
            <img [src]="'assets/images/Polygon.jpg'" alt="Polygon" class="Polygon">
                    <h1 class="TitleCreate">Create Account</h1>

                    <div class="rectangle3">
                        <img [src]="'assets/images/logos_gmail.jpg'" alt="logos_gmail">
                        <p class="signGmail">Sign Up With Google</p>
                    </div>
                    <div class="rectangle4">
                        <img [src]="'assets/images/logos_facebook.jpg'" alt="logos_facebook">
                        <p class="signefb">Sign Up With Facebook</p>
                    </div>  
                    <p class="or">-OR-</p>
                    <input type="text" name="Full Name" class="FullName">
                    <input type="text" name="Email Address" class="EmailAddress">
                    <input type="password" name="Password" class="Password">

                    <button class="BtnCreate">Create Account</button>

                    <p class="txt2">Already have an account? Log In</p>
    </div>
</div>
